{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Редактирование профиля</h1>

    <div class="row g-3">
        <div class="col-12 col-md-3 profile-sidebar-col">
            {% include 'accounts/_sidebar.html' %}
        </div>
        <div class="col-12 col-md-9 profile-content-col">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="first_name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="last_name" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="tel"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   placeholder="+7 (___) ___ __ __"
                                   value="{{ user.phone|default:'' }}"
                                   required>
                        </div>
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-3">
                            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* ============ МОБИЛЬНАЯ АДАПТАЦИЯ ФОРМЫ РЕДАКТИРОВАНИЯ ============ */

@media (max-width: 767.98px) {
    /* Контейнер — без лишних отступов */
    .container {
        padding-left: 8px;
        padding-right: 8px;
    }

    /* Заголовок страницы меньше */
    h1.mb-4 {
        font-size: 22px !important;
        margin-bottom: 16px !important;
    }

    /* Карточка — меньше padding */
    .card-body {
        padding: 16px !important;
    }

    /* Поля формы — крупные для пальца */
    .form-control {
        font-size: 16px;
        padding: 10px 12px;
        border-radius: 8px;
    }

    .form-label {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 4px;
    }

    .mb-3 {
        margin-bottom: 14px !important;
    }

    /* Кнопки формы — на всю ширину, друг под другом */
    .profile-content-col .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 15px;
        border-radius: 8px;
    }
}

@media (max-width: 575.98px) {
    /* Ещё компактнее для очень узких экранов */
    .card-body {
        padding: 12px !important;
    }

    .form-control {
        font-size: 15px;
        padding: 8px 10px;
    }
}
</style>

<!-- Inputmask -->
<script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/inputmask.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const phoneInput = document.getElementById('phone');
    if (!phoneInput || !window.Inputmask) return;

    // Настройка через пользовательский алиас
    Inputmask.extendAliases({
        ruPhone: {
            mask: '+7 (999) 999 99 99',
            placeholder: '+7 (___) ___ __ __',
            showMaskOnHover: false,
            showMaskOnFocus: true,
            clearIncomplete: false,
            autoUnmask: false,
            onBeforeMask: function (value) {
                if (!value) return value;
                let digits = String(value).replace(/\D/g, '');

                // 8XXXXXXXXXX → 7XXXXXXXXXX
                if (digits.startsWith('8')) digits = '7' + digits.slice(1);

                // 7XXXXXXXXXX (11 цифр) → отрезаем ведущую 7, оставляем 10 цифр для маски
                if (digits.startsWith('7') && digits.length > 10) {
                    digits = digits.slice(1);
                }
                // Если длина меньше 11 и начинается не с 7 — оставляем как есть

                return digits;
            },
            onBeforePaste: function (pastedValue) {
                let digits = String(pastedValue).replace(/\D/g, '');

                if (digits.startsWith('8')) digits = '7' + digits.slice(1);

                if (digits.startsWith('7') && digits.length > 10) {
                    digits = digits.slice(1);
                }

                return digits;
            },
        }
    });

    Inputmask({ alias: 'ruPhone' }).mask(phoneInput);
});
</script>
{% endblock %}
