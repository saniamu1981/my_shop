{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Смена пароля</h1>

    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="{% url 'accounts:profile' %}" class="list-group-item list-group-item-action">Профиль</a>
                <a href="{% url 'accounts:edit_profile' %}" class="list-group-item list-group-item-action">Редактировать профиль</a>
                <a href="{% url 'accounts:change_password' %}" class="list-group-item list-group-item-action active">Сменить пароль</a>
                <a href="{% url 'account_logout' %}" class="list-group-item list-group-item-action text-danger">Выйти</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary">Сменить пароль</button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
