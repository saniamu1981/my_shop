<div class="list-group profile-sidebar">
    <a href="{% url 'accounts:profile' %}"
       class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
        👤 Профиль
    </a>
    <a href="{% url 'accounts:edit_profile' %}"
       class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'edit_profile' %}active{% endif %}">
        ✏️ Редактировать профиль
    </a>
    <a href="{% url 'accounts:change_password' %}"
       class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'change_password' %}active{% endif %}">
        🔒 Сменить пароль
    </a>

    {% if user.is_staff or user.is_superuser %}
        <a href="{% url 'admin_panel:chat_list' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'chat_list' %}active{% endif %}">
            💬 Чат с пользователями
            {% if chat_unread_count %}
                <span class="badge bg-danger float-end">{{ chat_unread_count }}</span>
            {% endif %}
        </a>
    {% else %}
        <a href="{% url 'accounts:chat' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'chat' %}active{% endif %}">
            💬 Чат с поддержкой
            {% if chat_unread_count %}
                <span class="badge bg-danger float-end">{{ chat_unread_count }}</span>
            {% endif %}
        </a>
    {% endif %}

    <a href="{% url 'account_logout' %}" class="list-group-item list-group-item-action text-danger">
        🚪 Выйти
    </a>
</div>
