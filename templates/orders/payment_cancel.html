{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body">
                    <h1 class="display-1 text-warning">⚠️</h1>
                    <h2 class="card-title">Оплата отменена</h2>
                    <p class="card-text">Вы отменили процесс оплаты заказа №{{ order.id }}.</p>
                    <p class="card-text">Вы можете оплатить заказ позже в личном кабинете.</p>
                    <a href="{% url 'orders:order_detail' order.id %}" class="btn btn-primary">Вернуться к заказу</a>
                    <a href="{% url 'products:product_list' %}" class="btn btn-secondary">Продолжить покупки</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
