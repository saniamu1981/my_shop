<!-- PWA Install Banner -->
<div id="pwaInstallBanner" class="pwa-install-banner" style="display: none;">
    <div class="pwa-install-content">
        <div class="pwa-install-icon">
            <img src="/static/icons/icon-192x192.png" alt="Maidlingerie" width="40" height="40">
        </div>
        <div class="pwa-install-text">
            <div class="pwa-install-title">Установить приложение</div>
            <div class="pwa-install-subtitle">Быстрый доступ с главного экрана</div>
        </div>
        <div class="pwa-install-buttons">
            <button type="button" class="pwa-install-btn" id="pwaInstallBtn">Установить</button>
            <button type="button" class="pwa-install-close" id="pwaInstallClose" aria-label="Закрыть">✕</button>
        </div>
    </div>
</div>

<style>
.pwa-install-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
    padding: 12px 16px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
    border-top: 1px solid #e9ecef;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

.pwa-install-content {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
}

.pwa-install-icon img {
    border-radius: 10px;
    display: block;
}

.pwa-install-text {
    flex: 1;
    min-width: 0;
}

.pwa-install-title {
    font-size: 15px;
    font-weight: 600;
    color: #212529;
    margin-bottom: 2px;
}

.pwa-install-subtitle {
    font-size: 12px;
    color: #6c757d;
    line-height: 1.3;
}

.pwa-install-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.pwa-install-btn {
    background: #0d6efd;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
}

.pwa-install-btn:hover {
    background: #0b5ed7;
}

.pwa-install-close {
    background: transparent;
    border: none;
    color: #6c757d;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    border-radius: 6px;
    transition: background 0.2s;
}

.pwa-install-close:hover {
    background: #f8f9fa;
}

/* На мобильных — компактнее */
@media (max-width: 575.98px) {
    .pwa-install-banner {
        padding: 10px 12px;
    }
    .pwa-install-title {
        font-size: 14px;
    }
    .pwa-install-subtitle {
        font-size: 11px;
    }
    .pwa-install-btn {
        padding: 7px 12px;
        font-size: 13px;
    }
    .pwa-install-icon img {
        width: 36px;
        height: 36px;
    }
}
</style>

<script>
(function () {
    // Ключ для localStorage — не показывать баннер, если закрыли
    const DISMISS_KEY = 'pwa_install_dismissed';
    const DISMISS_DAYS = 7; // не показывать 7 дней после закрытия

    // Проверяем, не установлено ли уже приложение
    function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
    }

    // Проверяем, не закрывал ли пользователь баннер
    function isDismissed() {
        const dismissedAt = localStorage.getItem(DISMISS_KEY);
        if (!dismissedAt) return false;

        const daysAgo = (Date.now() - parseInt(dismissedAt, 10)) / (1000 * 60 * 60 * 24);
        return daysAgo < DISMISS_DAYS;
    }

    // Запоминаем, что пользователь закрыл баннер
    function dismiss() {
        localStorage.setItem(DISMISS_KEY, Date.now().toString());
    }

    const banner = document.getElementById('pwaInstallBanner');
    const installBtn = document.getElementById('pwaInstallBtn');
    const closeBtn = document.getElementById('pwaInstallClose');

    if (!banner) return;

    // Не показываем, если уже установлено или закрыто
    if (isStandalone() || isDismissed()) {
        return;
    }

    let deferredPrompt = null;

    // Chrome / Edge / Android: ловим beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'block';
    });

    // iOS Safari: показываем инструкцию (нет beforeinstallprompt)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if (isIOS && isSafari) {
        // Показываем баннер с инструкцией для iOS
        setTimeout(function () {
            if (!isDismissed() && !isStandalone()) {
                // Меняем текст на инструкцию
                const subtitle = banner.querySelector('.pwa-install-subtitle');
                if (subtitle) {
                    subtitle.textContent = 'Нажмите «Поделиться» → «На главный экран»';
                }
                const btn = banner.querySelector('.pwa-install-btn');
                if (btn) {
                    btn.textContent = 'Понятно';
                }
                banner.style.display = 'block';
            }
        }, 3000);
    }

    // Кнопка «Установить»
    if (installBtn) {
        installBtn.addEventListener('click', function () {
            if (deferredPrompt) {
                // Chrome/Android: показываем системный диалог
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function (choiceResult) {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('[PWA] Пользователь установил приложение');
                        banner.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            } else {
                // iOS: просто скрываем баннер (пользователь прочитал инструкцию)
                dismiss();
                banner.style.display = 'none';
            }
        });
    }

    // Кнопка «Закрыть»
    if (closeBtn) {
        closeBtn.addEventListener('click', function () {
            dismiss();
            banner.style.display = 'none';
        });
    }

    // Если приложение установили — скрываем баннер
    window.addEventListener('appinstalled', function () {
        console.log('[PWA] Приложение установлено');
        banner.style.display = 'none';
    });
})();
</script>
