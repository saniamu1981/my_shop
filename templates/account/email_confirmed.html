{% extends 'base.html' %}
{% load i18n %}

{% block title %}Email подтверждён{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">✅ Email подтверждён</h4>
                </div>
                <div class="card-body p-3 p-md-4 text-center">
                    <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>

                    <p class="lead mb-3">
                        Спасибо за подтверждение!
                    </p>

                    <p class="text-muted mb-4">
                        Ваш email успешно подтверждён. Теперь вы можете пользоваться
                        всеми возможностями личного кабинета.
                    </p>

                    <a href="{% url 'home' %}" class="btn btn-primary w-100">
                        🏠 На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
