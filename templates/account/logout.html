{% extends 'base.html' %}
{% load i18n %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white py-3">
                    <h4 class="mb-0">🚪 Выход из аккаунта</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="bi bi-question-circle" style="font-size: 48px; color: #dc3545;"></i>
                    </div>
                    <h5 class="mb-3">Вы уверены, что хотите выйти?</h5>
                    <p class="text-muted small">Вы будете перенаправлены на главную страницу.</p>

                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">Да, выйти</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
